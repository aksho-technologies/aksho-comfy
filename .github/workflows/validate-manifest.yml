name: validate-manifest

on:
  pull_request:
    paths: ['manifest.json']
  push:
    branches: [main]
    paths: ['manifest.json']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest.json
        run: |
          node -e '
            const m = JSON.parse(require("fs").readFileSync("manifest.json", "utf8"));
            const fail = (msg) => { console.error("INVALID: " + msg); process.exit(1); };
            if (!m.bundleVersion) fail("missing bundleVersion");
            if (!m.installerVersion) fail("missing installerVersion");
            if (!m.installerUrl) fail("missing installerUrl");
            if (!Array.isArray(m.components) || !m.components.length) fail("missing components");
            const ids = new Set();
            for (const c of m.components) {
              for (const key of ["id", "kind", "url", "targetPath"]) {
                if (!c[key]) fail(`component missing ${key}: ${JSON.stringify(c)}`);
              }
              if (!["file", "archive-extract"].includes(c.kind)) fail(`bad kind on ${c.id}`);
              if (ids.has(c.id)) fail(`duplicate id ${c.id}`);
              ids.add(c.id);
              if (typeof c.sha256 !== "string") fail(`bad sha256 on ${c.id}`);
              if (typeof c.sizeBytes !== "number") fail(`bad sizeBytes on ${c.id}`);
            }
            // Packs: what the pickers show. A base pack is a checkpoint people
            // pick (one or more, or none); it is never required, since every
            // consumer reads required as "always install". worksWith names the
            // model support packs a checkpoint or a tool runs on.
            if (!Array.isArray(m.packs) || !m.packs.length) fail("missing packs");
            const tiers = ["core", "base", "family", "recommended", "optional"];
            const packIds = new Set();
            const used = new Set();
            for (const p of m.packs) {
              if (!p.id || !p.label) fail(`pack missing id or label: ${JSON.stringify(p)}`);
              if (packIds.has(p.id)) fail(`duplicate pack ${p.id}`);
              packIds.add(p.id);
              if (!tiers.includes(p.tier)) fail(`bad tier on pack ${p.id}`);
              if (p.tier === "base" && p.required) fail(`base pack ${p.id} must not be required`);
              if (!Array.isArray(p.components)) fail(`pack ${p.id} has no components list`);
              for (const id of p.components) {
                if (!ids.has(id)) fail(`pack ${p.id} names unknown component ${id}`);
                used.add(id);
              }
            }
            for (const p of m.packs) {
              for (const s of p.worksWith ?? []) {
                const support = m.packs.find((q) => q.id === s);
                if (!support || support.tier !== "family") fail(`pack ${p.id} works with ${s}, which is not a model support pack`);
              }
            }
            for (const c of m.components) if (!used.has(c.id)) fail(`component ${c.id} is in no pack`);
            console.log(`manifest OK: bundle ${m.bundleVersion}, ${m.components.length} components, ${m.packs.length} packs`);
          '
